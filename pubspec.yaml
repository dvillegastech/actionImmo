name: action_immobiliaria
description: Application immobilière professionnelle pour le marché français
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # HTTP & API
  dio: ^5.7.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # UI & Animations
  flutter_native_splash: ^2.4.1
  url_launcher: ^6.3.0
  smooth_page_indicator: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  custom_lint: ^0.6.7
  riverpod_lint: ^2.6.2
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Splash Screen Configuration
flutter_native_splash:
  color: "#0A2463"
  image: assets/images/logo.png
  android_12:
    color: "#0A2463"
    image: assets/images/logo.png
  ios: true
  web: false
